<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>119番 住所特定AI支援 地図システム</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- ═══ Status Bar ═══ -->
  <div id="status-bar">
    <div class="status-left">
      <span id="call-status" class="status-badge idle">待機中</span>
      <span id="call-timer" class="status-timer">00:00</span>
    </div>
    <div class="status-center">
      <span class="system-title">119番 住所特定AI支援 地図システム</span>
    </div>
    <div class="status-right">
      <span id="gps-indicator" class="gps-badge none">GPS: --</span>
      <span id="ai-status" class="ai-badge idle">AI: 待機中</span>
    </div>
  </div>

  <!-- ═══ Search Bar ═══ -->
  <div id="search-container">
    <div id="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" id="search-input" placeholder="住所・建物名・表札名を入力..." autocomplete="off">
      <button id="search-clear" class="search-clear hidden">&times;</button>
    </div>
    <div id="search-results" class="hidden"></div>
  </div>

  <!-- ═══ Map ═══ -->
  <div id="map"></div>

  <!-- ═══ Layer Toggle ═══ -->
  <div id="layer-toggle">
    <button class="layer-btn active" data-layer="osm">地図</button>
    <button class="layer-btn" data-layer="aerial">航空写真</button>
    <button class="layer-btn" data-layer="hybrid">地図+航空写真</button>
  </div>

  <!-- ═══ Aerial Photo Panel ═══ -->
  <div id="aerial-panel" class="overlay-panel hidden">
    <div class="panel-header">
      <span class="panel-title">航空写真</span>
      <button class="panel-close">&times;</button>
    </div>
    <div id="aerial-map" class="panel-content"></div>
  </div>

  <!-- ═══ Street View Panel (OSM Mapillary/Static substitute) ═══ -->
  <div id="streetview-panel" class="overlay-panel hidden">
    <div class="panel-header">
      <span class="panel-title">ストリートビュー</span>
      <button class="panel-close">&times;</button>
    </div>
    <div id="streetview-content" class="panel-content">
      <div class="streetview-placeholder">
        <div class="sv-compass"></div>
        <div class="sv-info">
          <p class="sv-address">地点を選択してください</p>
          <p class="sv-hint">右クリック → 「この地点のストリートビューを表示」</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ AI Dialog Panel ═══ -->
  <div id="ai-dialog" class="hidden">
    <div class="ai-dialog-header">
      <div class="ai-dialog-title-row">
        <span class="ai-dialog-icon"></span>
        <span id="ai-dialog-title">AI支援</span>
      </div>
      <button id="ai-dialog-close" class="panel-close">&times;</button>
    </div>
    <div id="ai-dialog-subtitle"></div>
    <div id="ai-dialog-body"></div>
  </div>

  <!-- ═══ Right-click Context Menu ═══ -->
  <div id="context-menu" class="hidden">
    <div class="ctx-item" data-action="streetview">
      <span class="ctx-icon">&#128065;</span> この地点のストリートビューを表示
    </div>
    <div class="ctx-item" data-action="nearby">
      <span class="ctx-icon">&#128269;</span> この地点を中心に周辺検索
    </div>
    <div class="ctx-item" data-action="reverse-geocode">
      <span class="ctx-icon">&#128205;</span> この地点の住所を取得
    </div>
    <div class="ctx-item" data-action="aerial">
      <span class="ctx-icon">&#128752;</span> 航空写真で確認
    </div>
  </div>

  <!-- ═══ Demo Simulator Bar ═══ -->
  <div id="demo-bar">
    <div class="demo-section">
      <label class="demo-label">シナリオ:</label>
      <select id="demo-scenario">
        <option value="area_a">A: 同一番地密集（松戸）</option>
        <option value="area_b">B: 路上通報（柏）</option>
        <option value="area_c">C: テナント変更（流山）</option>
        <option value="area_d">D: 類似マンション（鎌ケ谷）</option>
      </select>
    </div>
    <div class="demo-section">
      <button id="demo-start" class="demo-btn start">通報開始</button>
      <button id="demo-end" class="demo-btn end" disabled>通報終了</button>
    </div>
    <div class="demo-section">
      <button id="demo-gps" class="demo-btn gps" disabled>GPS送信</button>
      <button id="demo-search" class="demo-btn search" disabled>住所検索シミュレート</button>
    </div>
    <div class="demo-section">
      <button id="demo-skip15" class="demo-btn skip" disabled>+15秒</button>
      <button id="demo-skip20" class="demo-btn skip" disabled>+20秒</button>
    </div>
    <div class="demo-section demo-info">
      <span id="demo-status">デモモード: 待機中</span>
    </div>
  </div>

  <!-- ═══ Map Popup (reused) ═══ -->
  <div id="map-popup" class="hidden">
    <div id="map-popup-content"></div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
  <script>
    // Pass config from server
    window.APP_CONFIG = {{ config | tojson }};
  </script>
  <script src="/static/js/events.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/search_bar.js"></script>
  <script src="/static/js/aerial.js"></script>
  <script src="/static/js/streetview.js"></script>
  <script src="/static/js/question_engine.js"></script>
  <script src="/static/js/ai_dialog.js"></script>
  <script src="/static/js/poi_search.js"></script>
  <script src="/static/js/context_panel.js"></script>
  <script src="/static/js/triggers.js"></script>
  <script src="/static/js/demo_simulator.js"></script>
</body>
</html>
