<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>119番 住所特定AI支援 地図システム</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Status Bar -->
  <header id="status-bar">
    <div class="sb-left">
      <span id="call-status" class="badge idle">待機中</span>
      <span id="call-timer" class="timer">00:00</span>
    </div>
    <div class="sb-center">119番 住所特定AI支援 地図システム</div>
    <div class="sb-right">
      <span id="gps-badge" class="badge gps-none">GPS: --</span>
      <span id="ai-badge" class="badge ai-idle">AI: 待機中</span>
    </div>
  </header>

  <!-- Main 2-column layout -->
  <div id="main-layout">
    <!-- Map Area (left) -->
    <div id="map-area">
      <div id="search-wrap">
        <div id="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/></svg>
          <input id="search-input" type="text" placeholder="住所・建物名・表札名を入力..." autocomplete="off">
          <button id="search-clear" class="hidden">&times;</button>
        </div>
        <div id="search-results" class="hidden"></div>
      </div>
      <div id="map"></div>
      <div id="layer-toggle">
        <button class="layer-btn active" data-layer="osm">地図</button>
        <button class="layer-btn" data-layer="aerial">航空写真</button>
        <button class="layer-btn" data-layer="hybrid">地図+写真</button>
      </div>
    </div>

    <!-- Right Panel: Transcript + Controls -->
    <div id="right-panel">
      <div id="rp-header">
        <div id="rp-scenario-row">
          <label>シナリオ</label>
          <select id="demo-scenario">
            <option value="area_a">A: 同一番地密集（松戸）</option>
            <option value="area_b">B: 路上通報（柏）</option>
            <option value="area_c">C: テナント変更（松戸）</option>
            <option value="area_d">D: 類似マンション（鎌ケ谷）</option>
            <option value="area_e">E: 複数コンビニ（松戸）</option>
            <option value="area_f">F: 類似団地棟（松戸・野菊野）</option>
            <option value="area_g">G: 複合対応（北松戸・GPS+ビル+テナント）</option>
            <option value="area_free">H: フリー会話</option>
          </select>
        </div>
        <div id="rp-btn-row">
          <button id="btn-start" class="dbtn red">開始</button>
          <button id="btn-reset" class="dbtn gray hidden">リセット</button>
        </div>
      </div>
      <div id="transcript-area">
        <div id="transcript-lines">
          <div class="tl-placeholder">シナリオを選択して「開始」をクリック</div>
        </div>
      </div>
      <div id="info-area">
        <div id="info-bar">
          <span id="info-icon"></span>
          <span id="info-title">情報表示エリア</span>
          <button id="info-close" class="info-x">&times;</button>
        </div>
        <div id="info-content">
          <div class="info-placeholder">キーワードをクリックして情報を表示</div>
        </div>
      </div>
      <div id="rp-footer">
        <button id="btn-next" class="dbtn-next" disabled>次へ →</button>
        <div id="step-counter" class="step-counter"></div>
        <div id="free-input" class="hidden">
          <div id="free-speaker-row">
            <button class="free-spk active" data-s="C">通報者</button>
            <button class="free-spk" data-s="D">指令員</button>
            <button class="free-spk" data-s="S">System</button>
          </div>
          <div id="free-text-row">
            <input id="free-text" type="text" placeholder="テキストを入力..." autocomplete="off">
            <button id="free-send">送信</button>
          </div>
        </div>
      </div>
    </div>
  </div>



  <!-- Keyword Action Menu -->
  <div id="kw-menu" class="hidden">
    <div class="kwm-label"></div>
    <div class="kwm-actions">
      <button class="kwm-btn" data-action="marker" title="地図にマーカー表示">📍<span>地図</span></button>
      <button class="kwm-btn" data-action="info" title="建物・物件情報">🏢<span>情報</span></button>
      <button class="kwm-btn" data-action="sv" title="ストリートビュー">📷<span>SV</span></button>
      <button class="kwm-btn" data-action="gmap" title="Googleマップで検索">🗺<span>Googleマップ</span></button>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="ctx-menu" class="hidden">
    <div class="ctx-item" data-action="sv">この地点のストリートビューを表示</div>
    <div class="ctx-item" data-action="nearby">この地点を中心に周辺検索</div>
    <div class="ctx-item" data-action="reverse">この地点の住所を取得</div>
    <div class="ctx-item" data-action="aerial">航空写真で確認</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
